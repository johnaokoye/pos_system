<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS System</title>
<link rel="stylesheet" href="/css/app.css">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" id="login-logo-content">
      <h1>&#9673; RetailPOS</h1>
      <p>Point of Sale System</p>
    </div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="Enter username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary login-btn" onclick="App.doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
    <div id="login-build-version" style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:16px"></div>
  </div>
</div>

<!-- Sidebar -->
<nav id="sidebar" style="display:none">
  <div class="sidebar-logo" id="sidebar-logo-content">
    <h1>&#9673; RetailPOS</h1>
    <p>Point of Sale System</p>
  </div>
  <div class="sidebar-nav">
    <div class="nav-item active" data-section="home">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </div>
    <div class="nav-item" data-section="dashboard">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Dashboard
    </div>
    <div class="nav-item" data-section="driver-dashboard" style="display:none">

      My Deliveries
    </div>
    <div class="nav-item" data-section="guard-dashboard" style="display:none">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 13.93l-3.5-3.5 1.41-1.41L11 12.1l5.59-5.59L18 7.93l-7 7z"/></svg>
      My Verifications
    </div>
    <div class="nav-item" data-section="sales-hub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>

      Accounts
    </div>
    <div class="nav-item" data-section="reports-hub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      Reports
    </div>
    <div class="nav-item" data-section="warehouse-hub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
      Warehouse
    </div>

      Purchasing
    </div>
    <div class="nav-item" data-section="dispatch">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      Dispatch
    </div>
    <div class="nav-item" data-section="admin-hub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      Admin
    </div>
    <a class="nav-item" href="/manual.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.5c-1.35-.85-3.8-1.5-5.5-1.5-1.65 0-3.35.3-4.75 1.05-.1.05-.15.05-.25.05-.25 0-.5-.25-.5-.5V6c.6-.45 1.25-.75 2-1 1.11-.35 2.33-.5 3.5-.5 1.95 0 4.05.4 5.5 1.5 1.45-1.1 3.55-1.5 5.5-1.5 1.17 0 2.39.15 3.5.5.75.25 1.4.55 2 1v14.6c0 .25-.25.5-.5.5-.1 0-.15 0-.25-.05-1.4-.75-3.1-1.05-4.75-1.05-1.7 0-4.15.65-5.5 1.5zM12 8v11.5c1.35-.65 3.8-1.5 5.5-1.5.65 0 1.28.06 1.9.19V6.19c-.63-.13-1.25-.19-1.9-.19-1.7 0-4.15.65-5.5 1.5z"/></svg>
      Manual
    </a>
  </div>
  <div class="sidebar-footer" style="cursor:pointer" title="My Profile — signature and password" onclick="App.showMyProfile()">
    <strong id="cashier-name"></strong>
    <span id="cashier-role" style="display:block;font-size:11px;opacity:.6;margin-top:2px"></span>
  </div>
</nav>
<div class="sidebar-backdrop" onclick="App.closeSidebar()"></div>

<!-- Main -->
<div id="main" style="display:none">
  <header id="topbar">
    <button id="hamburger-btn" onclick="App.toggleSidebar()" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <div id="topbar-title">Dashboard</div>
    <div id="topbar-right">
      <span id="clock"></span>
      <span id="low-stock-alert" style="display:none">
        <span class="badge" id="low-stock-count">0</span> Low Stock
      </span>
      <a id="topbar-user" href="#" title="My Profile — signature and password" onclick="event.preventDefault();App.showMyProfile()" style="font-size:13px;color:var(--text-muted);text-decoration:none;cursor:pointer"></a>
      <button class="btn btn-sm btn-secondary" onclick="App.logout()" style="font-size:12px">Sign Out</button>
    </div>
  </header>
  <div id="content"></div>
</div>

<!-- App code. Order matters: core.js declares App, the rest add to it, boot.js starts it. -->

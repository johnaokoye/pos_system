services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Local SQLite, persisted via the ./data volume below — the simplest
      # option for a self-hosted internal server. To use Turso instead,
      # delete this line and set TURSO_DATABASE_URL below to your libsql:// URL.
      TURSO_DATABASE_URL: file:/app/data/pos.db
      # Only read if TURSO_DATABASE_URL above is switched to a real Turso URL;
      # harmless no-op otherwise. Substituted directly (not via `env_file:`) so
      # this works whether the var comes from a local .env (docker compose CLI
      # auto-loads one from the project dir) or from a UI-managed deployment
      # tool like Portainer, which injects stack env vars into the compose
      # process rather than writing a literal .env file into the stack folder.
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    expose:
      - "3001"
    # No `ports:` mapping — internal-only on the Docker network, reached
    # through the `caddy` service below over HTTPS. Don't publish 3001 (or
    # map 443 here) as well: that would bypass HTTPS and clash with caddy.

  # HTTPS for the app, using a certificate from Caddy's own local CA (this
  # server is internal, so Let's Encrypt can't verify it). See Caddyfile.
  #
  # Portainer stack environment variables:
  #   POS_HOST    (required) name and/or IP staff browse to, comma-separated,
  #               e.g. "pos.office.lan, 192.168.1.20"
  #   POS_DEFAULT_SNI  the IP from POS_HOST, if staff browse by IP
  #               (e.g. "192.168.1.20") — browsing by IP fails without it
  #   HTTPS_PORT  host port for HTTPS (default 443 — keep it: the http://
  #               redirect always points at 443)
  #   HTTP_PORT   host port that redirects to HTTPS (default 80)
  #
  # Trusting the certificate: until each device trusts Caddy's root CA,
  # browsers show a certificate warning. Export the root once with
  #   docker compose exec caddy cat /data/caddy/pki/authorities/local/root.crt > pos-root.crt
  # (or Portainer > caddy container > Console: cat that path), then install
  # pos-root.crt as a trusted root on each device — Windows: double-click >
  # Install Certificate > Local Machine > "Trusted Root Certification
  # Authorities"; macOS: Keychain Access > System, set to Always Trust;
  # Android/iOS: install as a CA certificate in security settings.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      POS_HOST: ${POS_HOST:-localhost}
      POS_DEFAULT_SNI: ${POS_DEFAULT_SNI:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Holds the local CA and issued certificate — losing it means every
      # device has to trust a new root, so don't delete it on redeploy.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

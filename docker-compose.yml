services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Local SQLite, persisted via the ./data volume below — the simplest
      # option for a self-hosted internal server. To use Turso instead,
      # delete this line and set TURSO_DATABASE_URL below to your libsql:// URL.
      TURSO_DATABASE_URL: file:/app/data/pos.db
      # Only read if TURSO_DATABASE_URL above is switched to a real Turso URL;
      # harmless no-op otherwise. Substituted directly (not via `env_file:`) so
      # this works whether the var comes from a local .env (docker compose CLI
      # auto-loads one from the project dir) or from a UI-managed deployment
      # tool like Portainer, which injects stack env vars into the compose
      # process rather than writing a literal .env file into the stack folder.
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      # Consignment (supplier-owned stock) is off unless the stack sets
      # CONSIGNMENT_ENABLED=1 in its environment — on the test server first,
      # production only once it's approved.
      CONSIGNMENT_ENABLED: ${CONSIGNMENT_ENABLED:-0}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      # Off-server backup copies (Settings → Database Backups → "Also copy
      # each backup to folder: /app/backups-offsite"). Set POS_BACKUP_COPY_DIR
      # in the stack's environment to a host folder — e.g. a shared SMB folder
      # the host mounts at /mnt/pos-backups (see the manual). Unset, it's a
      # plain folder beside the stack and nothing is copied unless chosen.
      - ${POS_BACKUP_COPY_DIR:-./backups-offsite}:/app/backups-offsite
    expose:
      - "3001"
    # No `ports:` mapping — internal-only on the Docker network. Point your
    # own reverse proxy (nginx, Traefik, etc.) at this container's :3001,
    # or add a `ports:` mapping here if you want it reachable directly.
